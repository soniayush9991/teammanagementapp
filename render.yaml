# Render blueprint: one web service from the Dockerfile, plus managed Postgres.
#
# Deploy: push this repository, then in Render choose
# New → Blueprint → pick the repo. The two JWT secrets are generated for you
# and DATABASE_URL is wired from the database automatically.
#
# The free database plan expires after 30 days — fine for a demo, not for
# anything you care about.

services:
  - type: web
    name: teamspace
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '4000'
      # Generated once by Render and kept across deploys. Rotating them logs
      # everyone out, which is the intended effect of rotating a signing key.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: teamspace-db
          property: connectionString
      # Populates the demo organization on the first boot only; a restart never
      # overwrites data.
      - key: SEED_DEMO_ON_BOOT
        value: 'true'

databases:
  - name: teamspace-db
    plan: free
    postgresMajorVersion: '16'
